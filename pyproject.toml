[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "breastdivider"
version = "0.1.0"
description = "Python wrapper for the BreastDivider left/right breast MRI segmentation model."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC-BY-NC-SA-4.0" }
authors = [
    { name = "Benjamin Hamm", email = "benjamin.hamm@dkfz-heidelberg.de"},
    { name = "Maximilian Rokuss", email = "maximilian.rokuss@dkfz-heidelberg.de"},
    { name = "Yannick Kirchhoff", email = "yannick.kirchhoff@dkfz-heidelberg.de"}
]
keywords = [
  "breast-mri",
  "medical-imaging",
  "nnunet",
  "nnunetv2",
  "segmentation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: Healthcare Industry",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
  "huggingface_hub>=0.24",
  "nnunetv2>=2.6",
  "torch>=2.6,<2.9.0",
]

[project.urls]
Homepage = "https://github.com/MIC-DKFZ/breastdivider"
Repository = "https://github.com/MIC-DKFZ/breastdivider"

[project.scripts]
breastdivider = "breastdivider.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/breastdivider"]

[tool.hatch.build.targets.sdist]
include = [
  "/README.md",
  "/pyproject.toml",
  "/src",
]
